[project]
name = "sralnik"
version = "0.1.0"
description = "SRALNIK: Scene Reconstruction with Augmented Long-horizon Neural Indexed Knowledge"
requires-python = ">=3.11"
dependencies = [
    "ai2thor>=5.0.0",
    "diffusers>=0.27.0",
    "h5py>=3.11.0",
    "huggingface-hub>=0.20.0",
    "ipykernel>=7.2.0",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pygame-ce>=2.5.0",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.2.0",
    "torchvision>=0.18.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sralnik"]

# Pin torch to the cu128 wheel index so it works on DLAMI driver 570 (CUDA 12.8 max).
# The default PyPI torch wheel is built for cu13 which needs NVIDIA driver 580+.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
