[project]
name = "sralnik"
version = "0.1.0"
description = "SRALNIK: Scene Reconstruction with Augmented Long-horizon Neural Indexed Knowledge"
requires-python = ">=3.11"
dependencies = [
    "ai2thor>=5.0.0",
    "h5py>=3.11.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pygame-ce>=2.5.0",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sralnik"]
